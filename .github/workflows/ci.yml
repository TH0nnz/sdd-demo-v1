name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, '002-timesheet-management' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: timesheet_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Run backend unit tests
        run: |
          cd backend
          mvn clean test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: timesheet_test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
      
      - name: Run backend integration tests
        run: |
          cd backend
          mvn verify -P integration-test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: timesheet_test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
      
      - name: Generate coverage report
        run: |
          cd backend
          mvn jacoco:report
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/target/site/jacoco/jacoco.xml
          flags: backend
          name: backend-coverage

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      
      - name: Install pnpm
        run: npm install -g pnpm@8
      
      - name: Install dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile
      
      - name: Run linter
        run: |
          cd frontend
          pnpm run lint
      
      - name: Run type check
        run: |
          cd frontend
          pnpm run type-check
      
      - name: Run unit tests
        run: |
          cd frontend
          pnpm run test:unit:coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
      
      - name: Build
        run: |
          cd frontend
          pnpm run build

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install pnpm
        run: npm install -g pnpm@8
      
      - name: Install Playwright
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps
      
      - name: Start services
        run: |
          docker compose up -d
          sleep 30  # Wait for services to be ready
      
      - name: Run E2E tests
        run: |
          cd frontend
          pnpm run test:e2e
      
      - name: Stop services
        if: always()
        run: docker compose down
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Run backend checkstyle
        run: |
          cd backend
          mvn checkstyle:check
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install pnpm
        run: npm install -g pnpm@8
      
      - name: Frontend code quality
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run lint

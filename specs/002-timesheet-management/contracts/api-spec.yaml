# ========================================
# Components
# ========================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token 認證

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 專案 ID

    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 任務 ID

    TimesheetId:
      name: timesheetId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 工時記錄 ID

    TimeRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 時數申請 ID

    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 用戶 ID

    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 部門 ID

  responses:
    BadRequest:
      description: 請求參數錯誤或業務規則驗證失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validationError:
              summary: 驗證錯誤
              value:
                code: "VALIDATION_ERROR"
                message: "請求參數驗證失敗"
                timestamp: "2026-02-06T10:30:00"
                errors:
                  - field: "email"
                    message: "電子郵件格式不正確"
                  - field: "hours"
                    message: "工時必須為 0.5 的倍數"

    Unauthorized:
      description: 未登入或 Token 無效/過期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "UNAUTHORIZED"
            message: "請先登入"
            timestamp: "2026-02-06T10:30:00"

    Forbidden:
      description: 無權限執行此操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "FORBIDDEN"
            message: "您沒有權限執行此操作"
            timestamp: "2026-02-06T10:30:00"

    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "NOT_FOUND"
            message: "找不到指定的資源"
            timestamp: "2026-02-06T10:30:00"

    Conflict:
      description: 資料衝突（樂觀鎖定）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "OPTIMISTIC_LOCK_ERROR"
            message: "資料已被其他用戶修改，請重新載入最新資料後再試一次"
            timestamp: "2026-02-06T10:30:00"

  schemas:
    # ========== Enums ==========
    UserRole:
      type: string
      enum:
        - MANAGER
        - PM
        - DEPT_HEAD
        - EXECUTIVE
        - HR
      description: |
        用戶角色：
        - MANAGER: 管理層
        - PM: 專案經理
        - DEPT_HEAD: 部門主管
        - EXECUTIVE: 執行人員
        - HR: 人力資源

    ProjectStatus:
      type: string
      enum:
        - ACTIVE
        - CLOSED
      description: |
        專案狀態：
        - ACTIVE: 進行中
        - CLOSED: 已關閉

    TaskStatus:
      type: string
      enum:
        - PENDING
        - IN_PROGRESS
        - COMPLETED
      description: |
        任務狀態：
        - PENDING: 待開始
        - IN_PROGRESS: 進行中
        - COMPLETED: 已完成

    TimeRequestStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
      description: |
        時數申請狀態：
        - PENDING: 待審批
        - APPROVED: 已批准
        - REJECTED: 已拒絕

    # ========== Authentication ==========
    LoginResponse:
      type: object
      required:
        - token
        - tokenType
        - expiresIn
        - user
      properties:
        token:
          type: string
          description: JWT Token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        tokenType:
          type: string
          default: "Bearer"
        expiresIn:
          type: integer
          format: int64
          description: Token 有效期（秒）
          example: 86400
        user:
          $ref: '#/components/schemas/UserResponse'

    # ========== User ==========
    UserResponse:
      type: object
      required:
        - id
        - name
        - email
        - role
        - active
        - createdAt
        - version
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "張三"
        email:
          type: string
          format: email
          example: "zhangsan@example.com"
        role:
          $ref: '#/components/schemas/UserRole'
        department:
          $ref: '#/components/schemas/DepartmentSimpleResponse'
        active:
          type: boolean
          description: 帳號啟用狀態
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-01-01T10:00:00"
        updatedAt:
          type: string
          format: date-time
          example: "2026-02-01T15:30:00"
        version:
          type: integer
          description: 樂觀鎖定版本號
          example: 2

    CreateUserRequest:
      type: object
      required:
        - name
        - email
        - role
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "李四"
        email:
          type: string
          format: email
          example: "lisi@example.com"
        role:
          $ref: '#/components/schemas/UserRole'
        departmentId:
          type: integer
          format: int64
          example: 1
        initialPassword:
          type: string
          format: password
          description: 初始密碼（選填，不提供則系統自動生成）
          minLength: 8

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        role:
          $ref: '#/components/schemas/UserRole'
        departmentId:
          type: integer
          format: int64
        version:
          type: integer
          description: 樂觀鎖定版本號

    UserPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required:
            - content
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/UserResponse'

    # ========== Department ==========
    DepartmentResponse:
      type: object
      required:
        - id
        - name
        - createdAt
        - version
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "研發部"
        manager:
          $ref: '#/components/schemas/UserSimpleResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    DepartmentSimpleResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "研發部"

    DepartmentDetailResponse:
      allOf:
        - $ref: '#/components/schemas/DepartmentResponse'
        - type: object
          properties:
            members:
              type: array
              items:
                $ref: '#/components/schemas/UserSimpleResponse'
            memberCount:
              type: integer
              example: 15

    UserSimpleResponse:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string

    CreateDepartmentRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "銷售部"
        managerId:
          type: integer
          format: int64
          example: 5

    UpdateDepartmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        managerId:
          type: integer
          format: int64
        version:
          type: integer

    # ========== Project ==========
    ProjectResponse:
      type: object
      required:
        - id
        - name
        - totalHours
        - allocatedHours
        - usedHours
        - status
        - pm
        - createdAt
        - version
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "電商平台改版"
        description:
          type: string
          example: "重構前端架構，優化使用者體驗"
        totalHours:
          type: number
          format: double
          example: 500.0
        allocatedHours:
          type: number
          format: double
          description: 已分配給任務的時數
          example: 450.0
        usedHours:
          type: number
          format: double
          description: 實際已使用的時數
          example: 320.5
        remainingHours:
          type: number
          format: double
          description: 剩餘可分配時數 = totalHours - allocatedHours
          example: 50.0
        status:
          $ref: '#/components/schemas/ProjectStatus'
        pm:
          $ref: '#/components/schemas/UserSimpleResponse'
        createdBy:
          $ref: '#/components/schemas/UserSimpleResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    ProjectDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ProjectResponse'
        - type: object
          properties:
            taskCount:
              type: integer
              description: 任務總數
              example: 12
            completedTaskCount:
              type: integer
              description: 已完成任務數
              example: 8
            completionRate:
              type: number
              format: double
              description: 完成率 (%)
              example: 66.67

    CreateProjectRequest:
      type: object
      required:
        - name
        - totalHours
        - pmId
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
          example: "會員系統升級"
        description:
          type: string
          maxLength: 1000
        totalHours:
          type: number
          format: double
          minimum: 0
          example: 300.0
        pmId:
          type: integer
          format: int64
          description: 指派的 PM 用戶 ID
          example: 2

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        totalHours:
          type: number
          format: double
          minimum: 0
        pmId:
          type: integer
          format: int64
        version:
          type: integer
          description: 樂觀鎖定版本號

    ProjectPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required:
            - content
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/ProjectResponse'

    ProjectDashboardResponse:
      type: object
      required:
        - project
        - statistics
        - tasks
      properties:
        project:
          $ref: '#/components/schemas/ProjectResponse'
        statistics:
          type: object
          required:
            - totalTasks
            - pendingTasks
            - inProgressTasks
            - completedTasks
            - totalHours
            - allocatedHours
            - usedHours
            - remainingHours
            - utilizationRate
          properties:
            totalTasks:
              type: integer
              example: 15
            pendingTasks:
              type: integer
              example: 2
            inProgressTasks:
              type: integer
              example: 8
            completedTasks:
              type: integer
              example: 5
            totalHours:
              type: number
              format: double
              example: 500.0
            allocatedHours:
              type: number
              format: double
              example: 480.0
            usedHours:
              type: number
              format: double
              example: 320.5
            remainingHours:
              type: number
              format: double
              example: 20.0
            utilizationRate:
              type: number
              format: double
              description: 時數使用率 = usedHours / totalHours * 100%
              example: 64.1
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'

    # ========== Task ==========
    TaskResponse:
      type: object
      required:
        - id
        - name
        - estimatedHours
        - usedHours
        - status
        - project
        - assignee
        - createdAt
        - version
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "開發登入功能"
        description:
          type: string
          example: "實作 JWT 認證與 OAuth 2.0 登入"
        estimatedHours:
          type: number
          format: double
          example: 20.0
        usedHours:
          type: number
          format: double
          example: 15.5
        remainingHours:
          type: number
          format: double
          description: 剩餘時數 = estimatedHours - usedHours
          example: 4.5
        status:
          $ref: '#/components/schemas/TaskStatus'
        project:
          $ref: '#/components/schemas/ProjectSimpleResponse'
        assignee:
          $ref: '#/components/schemas/UserSimpleResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer

    ProjectSimpleResponse:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'

    TaskDetailResponse:
      allOf:
        - $ref: '#/components/schemas/TaskResponse'
        - type: object
          properties:
            timesheetCount:
              type: integer
              description: 工時記錄數量
              example: 8

    CreateTaskRequest:
      type: object
      required:
        - projectId
        - name
        - estimatedHours
        - assigneeId
      properties:
        projectId:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          minLength: 2
          maxLength: 200
          example: "設計資料庫 Schema"
        description:
          type: string
          maxLength: 2000
        estimatedHours:
          type: number
          format: double
          minimum: 0.5
          example: 15.0
        assigneeId:
          type: integer
          format: int64
          description: 指派的執行人員 ID
          example: 3

    UpdateTaskRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        estimatedHours:
          type: number
          format: double
          minimum: 0.5
        assigneeId:
          type: integer
          format: int64
        version:
          type: integer

    TaskPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required:
            - content
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/TaskResponse'

    # ========== Timesheet ==========
    TimesheetResponse:
      type: object
      required:
        - id
        - workDate
        - startTime
        - endTime
        - hours
        - lunchDeducted
        - task
        - user
        - createdAt
        - version
      properties:
        id:
          type: integer
          format: int64
          example: 1
        workDate:
          type: string
          format: date
          example: "2026-02-06"
        startTime:
          type: string
          pattern: '^([0-1][0-9]|2[0-3]):[0-5][0-9]$'
          example: "09:00"
        endTime:
          type: string
          pattern: '^([0-1][0-9]|2[0-3]):[0-5][0-9]$'
          example: "14:00"
        hours:
          type: number
          format: double
          description: 計算後的工時（已扣除午休）
          example: 4.0
        lunchDeducted:
          type: boolean
          description: 是否自動扣除午休時間
          example: true
        lunchHours:
          type: number
          format: double
          description: 扣除的午休時數
          example: 1.0
        task:
          $ref: '#/components/schemas/TaskSimpleResponse'
        user:
          $ref: '#/components/schemas/UserSimpleResponse'
        canEdit:
          type: boolean
          description: 當前用戶是否可以編輯此記錄（三個工作天內）
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    TaskSimpleResponse:
      type: object
      required:
        - id
        - name
        - project
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        project:
          $ref: '#/components/schemas/ProjectSimpleResponse'

    CreateTimesheetRequest:
      type: object
      required:
        - taskId
        - workDate
        - startTime
        - endTime
      properties:
        taskId:
          type: integer
          format: int64
          example: 1
        workDate:
          type: string
          format: date
          example: "2026-02-06"
        startTime:
          type: string
          pattern: '^([0-1][0-9]|2[0-3]):[0-5][0-9]$'
          example: "09:00"
        endTime:
          type: string
          pattern: '^([0-1][0-9]|2[0-3]):[0-5][0-9]$'
          example: "17:00"

    UpdateTimesheetRequest:
      type: object
      properties:
        workDate:
          type: string
          format: date
        startTime:
          type: string
          pattern: '^([0-1][0-9]|2[0-3]):[0-5][0-9]$'
        endTime:
          type: string
          pattern: '^([0-1][0-9]|2[0-3]):[0-5][0-9]$'
        version:
          type: integer

    TimesheetPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required:
            - content
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/TimesheetResponse'

    WorkHoursCalculationResponse:
      type: object
      required:
        - startTime
        - endTime
        - rawHours
        - lunchDeducted
        - lunchHours
        - calculatedHours
      properties:
        startTime:
          type: string
          example: "11:00"
        endTime:
          type: string
          example: "14:00"
        rawHours:
          type: number
          format: double
          description: 原始工時（未扣除午休）
          example: 3.0
        lunchDeducted:
          type: boolean
          description: 是否跨越午休時段
          example: true
        lunchHours:
          type: number
          format: double
          description: 扣除的午休時數
          example: 1.0
        calculatedHours:
          type: number
          format: double
          description: 最終工時（四捨五入到 0.5）
          example: 2.0
        message:
          type: string
          description: 提示訊息
          example: "已自動扣除午休時間 1.0 小時（12:00-13:00）"

    # ========== Time Request ==========
    TimeRequestResponse:
      type: object
      required:
        - id
        - requestedHours
        - reason
        - status
        - project
        - requester
        - requestedAt
        - version
      properties:
        id:
          type: integer
          format: int64
          example: 1
        requestedHours:
          type: number
          format: double
          example: 50.0
        reason:
          type: string
          example: "需求變更，增加新功能模組"
        status:
          $ref: '#/components/schemas/TimeRequestStatus'
        approvalComment:
          type: string
          nullable: true
          example: "批准增加時數，請合理分配"
        project:
          $ref: '#/components/schemas/ProjectSimpleResponse'
        requester:
          $ref: '#/components/schemas/UserSimpleResponse'
        approver:
          $ref: '#/components/schemas/UserSimpleResponse'
          nullable: true
        requestedAt:
          type: string
          format: date-time
        approvedAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer

    CreateTimeRequestRequest:
      type: object
      required:
        - projectId
        - requestedHours
        - reason
      properties:
        projectId:
          type: integer
          format: int64
          example: 1
        requestedHours:
          type: number
          format: double
          minimum: 0.5
          example: 50.0
        reason:
          type: string
          minLength: 10
          maxLength: 2000
          example: "客戶要求增加報表匯出功能，預計需要額外 50 小時"

    TimeRequestPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required:
            - content
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/TimeRequestResponse'

    # ========== Reports ==========
    TimesheetReportResponse:
      type: object
      required:
        - summary
        - details
      properties:
        summary:
          type: object
          required:
            - totalHours
            - totalEntries
            - userCount
          properties:
            totalHours:
              type: number
              format: double
              description: 總工時
              example: 320.5
            totalEntries:
              type: integer
              description: 工時記錄總數
              example: 48
            userCount:
              type: integer
              description: 填報人數
              example: 6
        details:
          type: array
          items:
            type: object
            required:
              - user
              - totalHours
              - entries
            properties:
              user:
                $ref: '#/components/schemas/UserSimpleResponse'
              totalHours:
                type: number
                format: double
                example: 40.0
              entries:
                type: integer
                example: 8

    ProjectSummaryReportResponse:
      type: object
      required:
        - totalProjects
        - activeProjects
        - closedProjects
        - totalHours
        - usedHours
        - utilizationRate
        - projects
      properties:
        totalProjects:
          type: integer
          example: 10
        activeProjects:
          type: integer
          example: 7
        closedProjects:
          type: integer
          example: 3
        totalHours:
          type: number
          format: double
          example: 5000.0
        usedHours:
          type: number
          format: double
          example: 3200.5
        utilizationRate:
          type: number
          format: double
          description: 時數使用率 (%)
          example: 64.01
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectResponse'

    # ========== Common ==========
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "操作成功"

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
          description: 錯誤代碼
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: 錯誤訊息
          example: "請求參數驗證失敗"
        timestamp:
          type: string
          format: date-time
          example: "2026-02-06T10:30:00"
        errors:
          type: array
          description: 詳細錯誤列表（驗證錯誤時使用）
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                example: "email"
              message:
                type: string
                example: "電子郵件格式不正確"

    PageMetadata:
      type: object
      required:
        - page
        - size
        - totalElements
        - totalPages
      properties:
        page:
          type: integer
          description: 當前頁碼（從 0 開始）
          example: 0
        size:
          type: integer
          description: 每頁大小
          example: 20
        totalElements:
          type: integer
          format: int64
          description: 總記錄數
          example: 150
        totalPages:
          type: integer
          description: 總頁數
          example: 8

openapi: 3.0.3
info:
  title: 工時管理系統 API
  description: |
    完整的工時管理系統 REST API 規格
    
    **技術棧**: JDK 21 + Spring Boot 3.2 + PostgreSQL 14
    
    **功能模組**:
    - 認證與授權 (Authentication)
    - 專案管理 (Projects)
    - 任務管理 (Tasks)
    - 工時填報 (Timesheets)
    - 時數申請 (Time Requests)
    - 報表查詢 (Reports)
    - 用戶管理 (Users)
    - 部門管理 (Departments)
    
    **安全性**: Bearer Token (JWT)
    
  version: 1.0.0
  contact:
    name: 後端開發團隊
    email: dev-team@example.com

servers:
  - url: http://localhost:8080
    description: 本地開發環境
  - url: https://api-staging.example.com
    description: 測試環境
  - url: https://api.example.com
    description: 生產環境

tags:
  - name: Authentication
    description: 認證與授權 API
  - name: Projects
    description: 專案管理 API (管理層、PM)
  - name: Tasks
    description: 任務管理 API (PM、執行人員)
  - name: Timesheets
    description: 工時填報 API (執行人員、PM、部門主管)
  - name: Time Requests
    description: 時數申請 API (PM、管理層)
  - name: Reports
    description: 報表查詢與匯出 API
  - name: Users
    description: 用戶管理 API (HR)
  - name: Departments
    description: 部門管理 API (HR、部門主管)

security:
  - BearerAuth: []

paths:
  # ========================================
  # Authentication APIs
  # ========================================
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: 用戶登入
      description: |
        使用電子郵件和密碼進行登入驗證
        **對應需求**: FR-028-1
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "pm@example.com"
                password:
                  type: string
                  format: password
                  example: "password123"
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: 取得當前用戶資訊
      description: |
        根據 JWT Token 取得當前登入用戶的詳細資訊
      operationId: getCurrentUser
      responses:
        '200':
          description: 成功取得用戶資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/change-password:
    post:
      tags:
        - Authentication
      summary: 修改密碼
      description: 用戶修改自己的密碼
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: 密碼修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ========================================
  # Project APIs
  # ========================================
  /api/projects:
    get:
      tags:
        - Projects
      summary: 查詢專案列表
      description: |
        根據角色自動過濾專案：
        - 管理層：所有專案
        - PM：自己管理的專案
        - 部門主管：本部門相關專案
        **對應需求**: FR-004
      operationId: listProjects
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProjectStatus'
        - name: pmId
          in: query
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            default: "createdAt,desc"
      responses:
        '200':
          description: 成功取得專案列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Projects
      summary: 建立新專案
      description: |
        管理層建立新專案並分派給 PM
        **對應需求**: FR-001
        **權限**: MANAGER
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: 專案建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/projects/{projectId}:
    get:
      tags:
        - Projects
      summary: 取得專案詳情
      description: |
        取得指定專案的詳細資訊，包含即時統計
        **對應需求**: FR-004
      operationId: getProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 成功取得專案詳情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags:
        - Projects
      summary: 更新專案資訊
      description: |
        管理層修改專案名稱、總時數、PM
        **對應需求**: FR-002
        **權限**: MANAGER
      operationId: updateProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: 專案更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - Projects
      summary: 刪除專案
      description: |
        刪除尚未有任務的專案（軟刪除）
        **權限**: MANAGER
      operationId: deleteProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '204':
          description: 專案刪除成功
        '400':
          description: 專案已有任務，無法刪除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/{projectId}/close:
    post:
      tags:
        - Projects
      summary: 關閉專案
      description: |
        管理層關閉專案，禁止新增任務和填報工時
        **對應需求**: FR-003, FR-032
        **權限**: MANAGER
      operationId: closeProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 專案關閉成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/{projectId}/dashboard:
    get:
      tags:
        - Projects
      summary: 專案儀表板
      description: |
        PM 即時查看專案進度、時數使用情況、任務狀態
        **對應需求**: FR-021
        **權限**: PM, MANAGER
      operationId: getProjectDashboard
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 成功取得專案儀表板
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDashboardResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ========================================
  # Task APIs
  # ========================================
  /api/tasks:
    get:
      tags:
        - Tasks
      summary: 查詢任務列表
      description: |
        根據角色自動過濾任務：
        - 執行人員：自己被指派的任務
        - PM：自己管理的專案的所有任務
        - 部門主管：本部門成員的任務
        **對應需求**: FR-010
      operationId: listTasks
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
            format: int64
        - name: assigneeId
          in: query
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功取得任務列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Tasks
      summary: 建立新任務
      description: |
        PM 在專案下建立任務並指派給執行人員
        系統檢查專案剩餘時數，不足時發出警告但允許繼續
        **對應需求**: FR-005, FR-008
        **權限**: PM
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: 任務建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
          headers:
            X-Warning:
              description: 專案剩餘時數不足的警告訊息
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/tasks/{taskId}:
    get:
      tags:
        - Tasks
      summary: 取得任務詳情
      description: |
        取得指定任務的詳細資訊
        **對應需求**: FR-009
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 成功取得任務詳情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags:
        - Tasks
      summary: 更新任務資訊
      description: |
        PM 修改任務名稱、預估時數、指派人員
        **對應需求**: FR-006
        **權限**: PM
      operationId: updateTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: 任務更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - Tasks
      summary: 刪除任務
      description: |
        PM 刪除尚未有工時記錄的任務
        **對應需求**: FR-007
        **權限**: PM
      operationId: deleteTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '204':
          description: 任務刪除成功
        '400':
          description: 任務已有工時記錄，無法刪除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tasks/{taskId}/complete:
    post:
      tags:
        - Tasks
      summary: 標記任務完成
      description: |
        執行人員將任務狀態改為「已完成」
        即使剩餘時數大於零也允許完成
        **對應需求**: FR-016
        **權限**: EXECUTIVE, PM
      operationId: completeTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 任務標記完成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ========================================
  # Timesheet APIs
  # ========================================
  /api/timesheets:
    get:
      tags:
        - Timesheets
      summary: 查詢工時記錄
      description: |
        根據角色自動過濾工時記錄：
        - 執行人員：只能查看自己的工時
        - PM：可查看管理專案的所有工時
        - 部門主管：可查看部門成員的工時
        - 管理層、HR：可查看所有工時
        **對應需求**: FR-010, FR-022
      operationId: listTimesheets
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
            format: int64
        - name: taskId
          in: query
          schema:
            type: integer
            format: int64
        - name: projectId
          in: query
          schema:
            type: integer
            format: int64
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功取得工時記錄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Timesheets
      summary: 填報工時
      description: |
        執行人員填報工時，系統自動計算工時並扣除午休時間
        檢查任務剩餘時數，不足時警告但允許提交並通知 PM
        **對應需求**: FR-011, FR-012, FR-012-1, FR-013, FR-015
        **權限**: EXECUTIVE
      operationId: createTimesheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimesheetRequest'
      responses:
        '201':
          description: 工時填報成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetResponse'
          headers:
            X-Warning:
              description: 任務剩餘時數不足的警告訊息
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/timesheets/calculate-preview:
    post:
      tags:
        - Timesheets
      summary: 預覽工時計算
      description: |
        根據起始時間和結束時間預覽計算結果
        包含午休時間扣除提示
        **對應需求**: FR-012, FR-012-1
      operationId: calculateTimesheetPreview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - startTime
                - endTime
              properties:
                startTime:
                  type: string
                  pattern: '^([0-1][0-9]|2[0-3]):[0-5][0-9]$'
                  example: "09:00"
                endTime:
                  type: string
                  pattern: '^([0-1][0-9]|2[0-3]):[0-5][0-9]$'
                  example: "14:00"
      responses:
        '200':
          description: 工時計算預覽
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkHoursCalculationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/timesheets/{timesheetId}:
    get:
      tags:
        - Timesheets
      summary: 取得工時記錄詳情
      description: 取得指定工時記錄的詳細資訊
      operationId: getTimesheet
      parameters:
        - $ref: '#/components/parameters/TimesheetId'
      responses:
        '200':
          description: 成功取得工時記錄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags:
        - Timesheets
      summary: 修改工時記錄
      description: |
        執行人員修改自己的工時記錄
        只能編輯過去三個工作天內（含當天）的記錄
        **對應需求**: FR-014, FR-031
        **權限**: EXECUTIVE
      operationId: updateTimesheet
      parameters:
        - $ref: '#/components/parameters/TimesheetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTimesheetRequest'
      responses:
        '200':
          description: 工時記錄更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetResponse'
        '400':
          description: 超過可編輯期限（三個工作天）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - Timesheets
      summary: 刪除工時記錄
      description: |
        執行人員刪除自己的工時記錄
        只能刪除過去三個工作天內的記錄
        **對應需求**: FR-014, FR-031
        **權限**: EXECUTIVE
      operationId: deleteTimesheet
      parameters:
        - $ref: '#/components/parameters/TimesheetId'
      responses:
        '204':
          description: 工時記錄刪除成功
        '400':
          description: 超過可編輯期限（三個工作天）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ========================================
  # Time Request APIs
  # ========================================
  /api/time-requests:
    get:
      tags:
        - Time Requests
      summary: 查詢時數申請列表
      description: |
        根據角色過濾：
        - PM：自己提交的申請
        - 管理層：所有待審批或已審批的申請
        **對應需求**: FR-020
      operationId: listTimeRequests
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TimeRequestStatus'
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功取得申請列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRequestPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Time Requests
      summary: 提交時數申請
      description: |
        PM 向管理層提交增加專案時數的申請
        **對應需求**: FR-017, FR-018
        **權限**: PM
      operationId: createTimeRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimeRequestRequest'
      responses:
        '201':
          description: 申請提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/time-requests/{requestId}:
    get:
      tags:
        - Time Requests
      summary: 取得申請詳情
      description: 取得指定時數申請的詳細資訊
      operationId: getTimeRequest
      parameters:
        - $ref: '#/components/parameters/TimeRequestId'
      responses:
        '200':
          description: 成功取得申請詳情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRequestResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/time-requests/{requestId}/approve:
    post:
      tags:
        - Time Requests
      summary: 批准時數申請
      description: |
        管理層批准 PM 的時數申請，系統自動增加專案總時數
        **對應需求**: FR-019
        **權限**: MANAGER
      operationId: approveTimeRequest
      parameters:
        - $ref: '#/components/parameters/TimeRequestId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  maxLength: 2000
                  example: "批准增加時數，請合理分配"
      responses:
        '200':
          description: 申請批准成功，專案時數已增加
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRequestResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: 申請狀態不是待審批
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/time-requests/{requestId}/reject:
    post:
      tags:
        - Time Requests
      summary: 拒絕時數申請
      description: |
        管理層拒絕 PM 的時數申請，附上拒絕原因
        **對應需求**: FR-019
        **權限**: MANAGER
      operationId: rejectTimeRequest
      parameters:
        - $ref: '#/components/parameters/TimeRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - comment
              properties:
                comment:
                  type: string
                  minLength: 10
                  maxLength: 2000
                  example: "請先優化現有任務的時數分配"
      responses:
        '200':
          description: 申請拒絕成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRequestResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: 申請狀態不是待審批或缺少拒絕原因
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'


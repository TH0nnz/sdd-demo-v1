version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: timesheet-postgres
    environment:
      POSTGRES_DB: timesheet_db
      POSTGRES_USER: timesheet_user
      POSTGRES_PASSWORD: timesheet_password
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      TZ: Asia/Taipei
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timesheet_user -d timesheet_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - timesheet-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timesheet-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: timesheet_db
      DB_USER: timesheet_user
      DB_PASSWORD: timesheet_password
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production-must-be-at-least-256-bits}
      SERVER_PORT: 8080
      TZ: Asia/Taipei
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - timesheet-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: timesheet-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
      TZ: Asia/Taipei
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - timesheet-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  timesheet-network:
    driver: bridge

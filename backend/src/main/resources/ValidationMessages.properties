constraint.invalid.work.hours=工作時數格式或範圍不正確
constraint.invalid.lunch.deduction.hours=午餐扣除時間無效
constraint.invalid.date.format=日期格式不正確
constraint.business.rule.violation=業務規則違反：{message}

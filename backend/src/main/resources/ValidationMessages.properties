# Input Validation Messages - Traditional Chinese
# For Spring Bean Validation (JSR-303, JSR-380)

# Common Messages
javax.validation.constraints.NotNull.message=此欄位不可為空
javax.validation.constraints.NotBlank.message=此欄位不可為空
javax.validation.constraints.NotEmpty.message=此欄位不可為空
javax.validation.constraints.Min.message=值必須大於等於 {value}
javax.validation.constraints.Max.message=值必須小於等於 {value}
javax.validation.constraints.Size.message=長度必須在 {min} 至 {max} 個字符之間
javax.validation.constraints.Pattern.message=格式不符合要求
javax.validation.constraints.Email.message=電子郵件格式不正確
javax.validation.constraints.Positive.message=值必須為正數
javax.validation.constraints.PositiveOrZero.message=值必須為正數或零
javax.validation.constraints.DecimalMin.message=值必須大於等於 {value}
javax.validation.constraints.DecimalMax.message=值必須小於等於 {value}
javax.validation.constraints.Future.message=日期必須是未來的日期
javax.validation.constraints.FutureOrPresent.message=日期必須是未來或今天
javax.validation.constraints.Past.message=日期必須是過去的日期
javax.validation.constraints.PastOrPresent.message=日期必須是過去或今天
javax.validation.constraints.Length.message=字符串長度必須在 {min} 至 {max} 個字符之間
javax.validation.constraints.Range.message=值必須在 {min} 至 {max} 之間

# Domain-specific Messages
workHours.invalid.range=工時必須在 0 到 24 小時之間
workHours.invalid.decimal=工時只能保留到小數點後一位
workHours.exceed.daily.limit=單日工時不能超過 {limit} 小時
workHours.exceed.weekly.limit=本週工時不能超過 {limit} 小時
workHours.invalid.lunch.deduction=午餐扣除時間必須為 0.5 或 1 小時

timesheet.invalid.date=工時日期不能為未來日期
timesheet.invalid.edit.period=只能編輯三個工作日內的工時
timesheet.duplicate.entry=該日期已有工時紀錄
timesheet.invalid.date.range=開始日期不能晚於結束日期

project.name.required=專案名稱為必填
project.code.invalid.format=專案代碼只能包含字母、數字和下劃線
project.date.invalid.range=專案開始日期不能晚於結束日期
project.manager.invalid=專案經理必須存在

task.name.required=任務名稱為必填
task.project.required=任務必須指派到專案
task.assignee.required=任務必須指派給員工
task.date.invalid.range=任務開始日期不能晚於結束日期
task.status.invalid=任務狀態不正確

user.name.required=員工名稱為必填
user.email.required=電子郵件為必填
user.email.unique=此電子郵件已被使用
user.password.weak=密碼強度不足，必須包含大小寫字母、數字和特殊符號
user.password.min.length=密碼長度至少為 8 個字符
user.role.invalid=員工角色不正確

department.name.required=部門名稱為必填
department.code.required=部門代碼為必填
department.code.unique=該部門代碼已被使用
department.code.format=部門代碼只能包含字母和數字

time.request.reason.required=申請原因為必填
time.request.duration.invalid=申請時數必須大於零
time.request.date.invalid=申請日期不能為未來日期
time.request.status.invalid=申請狀態不正確

# API Response Messages
api.error.not.found=找不到指定的資源
api.error.unauthorized=您沒有權限執行此操作
api.error.forbidden=禁止訪問
api.error.conflict=資源衝突
api.error.internal.server.error=伺服器內部錯誤
api.error.invalid.request=請求參數無效


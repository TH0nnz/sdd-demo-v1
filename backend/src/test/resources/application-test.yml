spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  security:
    user:
      name: testuser
      password: testpass

jwt:
  secret: test-secret-key-for-testing-minimum-32-characters-needed
  expiration: 86400000
